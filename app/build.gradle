plugins {
    id 'com.android.application'
}

android {
    namespace 'app.qrscanner'
    compileSdk 35

    defaultConfig {
        applicationId 'app.qrscanner'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Camera + QR decoding (works offline, no Google Play services needed)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.activity:activity:1.9.3'
    // Align Kotlin library versions pulled in by dependencies (avoids duplicate-class errors)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
